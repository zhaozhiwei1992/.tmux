session_name: secure-dev
start_directory: "#{pwd}"
shell_command_before:
  - "" # 占位，确保各 pane 独立命令
windows:
  - window_name: code
    layout: main-vertical
    options:
      main-pane-width: 70% # 同 dev.yaml
    panes:
      - shell_command:
          - nvim # pane 0：宿主 nvim（用户主动编辑，不走沙箱）
      - shell_command:
          - ~/.local/bin/bwrap-pi . # pane 1：沙箱内 pi（断网 + home 只读 + 唯一写面=当前项目）
      - shell_command: [] # pane 2：宿主 console

